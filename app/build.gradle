plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexdesrosier.lockplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alexdesrosier.lockplayer'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
